<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BonCloud — Acceso</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="login-container">

    <div class="login-brand">
      <h1>BonCloud</h1>
      <p>Plataforma de Comercio Exterior</p>
    </div>

    <form class="login-form" id="loginForm">

      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="usuario@correo.com" required>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="login-options">
        <label class="remember">
          <input type="checkbox" id="remember"> Recordarme
        </label>
        <a href="#">¿Olvido su contraseña?</a>
      </div>

      <button type="submit" class="btn-login">Ingresar</button>

      <p class="register-link">¿No tienes cuenta? <a href="#">Regístrate</a></p>

    </form>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
